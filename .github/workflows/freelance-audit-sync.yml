name: Freelance audit sync

on:
  push:
    paths:
      - '.github/workflows/freelance-audit-sync.yml'
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: freelance-audit-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch audit feed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p freelance_audit
          curl -fsS https://kwork-hunter.vova2015serjant.workers.dev/audit-export -o freelance_audit/audit.json.tmp
          mv freelance_audit/audit.json.tmp freelance_audit/audit.json
      - name: Commit changes
        shell: bash
        run: |
          git config user.name 'freelance-audit-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add freelance_audit/audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'Sync freelance audit decisions'
            git push
          fi
