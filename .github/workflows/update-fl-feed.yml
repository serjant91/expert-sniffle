name: Update FL.ru feed

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fl-feed
  cancel-in-progress: true

jobs:
  update:
    if: github.actor != 'fl-feed-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build feed
        run: python3 fl_feed.py

      - name: Commit changed feed
        run: |
          git add feed.json
          if git diff --cached --quiet; then
            echo "No feed changes"
            exit 0
          fi
          git config user.name "fl-feed-bot"
          git config user.email "fl-feed-bot@users.noreply.github.com"
          git commit -m "Update FL.ru feed"
          git push
